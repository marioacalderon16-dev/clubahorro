<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sorteo de Turnos — Club de Ahorro</title>
<style>
  :root {
    --bg: #0e1b30;
    --bg-card: #142240;
    --bg-reel: #0b1526;
    --border: #1e3355;
    --text: #e4eaf2;
    --text-dim: #6b8aad;
    --accent: #7cb62f;
    --accent-glow: rgba(124, 182, 47, 0.3);
    --navy: #1a2d4d;
    --green-dark: #1b6b3a;
    --red: #e05252;
    --rank-gold: #7cb62f;
    --rank-silver: #8a9bb5;
    --rank-bronze: #1b6b3a;
    --btn-text: #ffffff;
  }

  :root[data-theme="light"] {
    --bg: #f2f5f0;
    --bg-card: #ffffff;
    --bg-reel: #e6ebe0;
    --border: #c8d4be;
    --text: #1a2d4d;
    --text-dim: #5a7a6a;
    --accent: #5a9a1a;
    --accent-glow: rgba(90, 154, 26, 0.15);
    --navy: #1a2d4d;
    --green-dark: #1b6b3a;
    --red: #c0392b;
    --rank-gold: #5a9a1a;
    --rank-silver: #5a7080;
    --rank-bronze: #1b6b3a;
    --btn-text: #ffffff;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f5f0;
      --bg-card: #ffffff;
      --bg-reel: #e6ebe0;
      --border: #c8d4be;
      --text: #1a2d4d;
      --text-dim: #5a7a6a;
      --accent: #5a9a1a;
      --accent-glow: rgba(90, 154, 26, 0.15);
      --navy: #1a2d4d;
      --green-dark: #1b6b3a;
      --red: #c0392b;
      --rank-gold: #5a9a1a;
      --rank-silver: #5a7080;
      --rank-bronze: #1b6b3a;
      --btn-text: #ffffff;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
    -webkit-user-select: none;
    user-select: none;
  }

  .guide {
    width: 100%;
    max-width: 340px;
    background: var(--bg-card);
    border: 1.5px solid var(--accent);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .guide.hidden { display: none; }

  .guide-step {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--text);
  }

  .guide-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--btn-text);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-bottom: 10px;
    object-fit: cover;
  }

  h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
    text-align: center;
  }

  .tagline {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 24px;
    text-align: center;
  }

  .input-area {
    width: 100%;
    max-width: 340px;
    margin-bottom: 20px;
  }

  .input-area input {
    width: 100%;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 16px;
    color: var(--text);
    outline: none;
    text-align: center;
    font-weight: 500;
    transition: border-color 0.2s;
  }

  .input-area input::placeholder {
    color: var(--text-dim);
    font-weight: 400;
  }

  .input-area input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .machine {
    width: 100%;
    max-width: 340px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .reels {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .reel-window {
    width: 72px;
    height: 90px;
    background: var(--bg-reel);
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }

  .reel-window::before,
  .reel-window::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 20px;
    z-index: 2;
    pointer-events: none;
  }

  .reel-window::before {
    top: 0;
    background: linear-gradient(to bottom, var(--bg-reel), transparent);
  }

  .reel-window::after {
    bottom: 0;
    background: linear-gradient(to top, var(--bg-reel), transparent);
  }

  .reel-canvas {
    width: 72px;
    height: 90px;
    display: block;
  }

  .reel-window .center-line {
    position: absolute;
    top: 50%;
    left: 4px;
    right: 4px;
    height: 0;
    border-top: 1.5px dashed var(--accent);
    opacity: 0.4;
    transform: translateY(-50%);
    z-index: 3;
    pointer-events: none;
  }

  .result-num {
    font-family: 'Menlo', 'Courier New', monospace;
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.1em;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.3s, transform 0.3s;
  }

  .result-num.visible {
    opacity: 1;
    transform: scale(1);
  }

  .spin-btn {
    width: 100%;
    max-width: 260px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--btn-text);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .spin-btn:active { transform: scale(0.96); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .ranking {
    width: 100%;
    max-width: 340px;
  }

  .ranking-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .ranking-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .ranking-count {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .rank-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 6px;
    animation: slideIn 0.3s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .rank-pos {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    background: var(--border);
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .rank-row:nth-child(1) .rank-pos { background: var(--rank-gold); color: #fff; }
  .rank-row:nth-child(2) .rank-pos { background: var(--rank-silver); color: #fff; }
  .rank-row:nth-child(3) .rank-pos { background: var(--rank-bronze); color: #fff; }

  .rank-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rank-score {
    font-family: 'Menlo', 'Courier New', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }

  .empty-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 6px;
    opacity: 0.35;
  }

  .empty-row .rank-pos { background: var(--border); color: var(--text-dim); }
  .empty-row .rank-name { color: var(--text-dim); font-style: italic; font-weight: 400; font-size: 13px; }
  .empty-row .rank-score { color: var(--text-dim); opacity: 0.5; }

  .reset-btn {
    margin-top: 16px;
    padding: 10px 24px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .reset-btn:active { border-color: var(--red); color: var(--red); }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg-card);
    border: 1.5px solid var(--accent);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: transform 0.3s ease-out, opacity 0.3s;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .rank-row { animation: none; }
    .toast { transition: none; }
    .result-num { transition: none; }
  }

  .lobby {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .lobby-card {
    width: 100%;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .lobby-btn {
    width: 100%;
    max-width: 260px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s, opacity 0.2s;
  }

  .lobby-btn:active { transform: scale(0.96); }

  .lobby-btn.primary {
    background: var(--accent);
    color: var(--btn-text);
  }

  .lobby-btn.secondary {
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
  }

  .lobby-divider {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 260px;
    gap: 12px;
    color: var(--text-dim);
    font-size: 13px;
  }

  .lobby-divider::before,
  .lobby-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .lobby-join {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .lobby-input {
    width: 100%;
    max-width: 260px;
    background: var(--bg-reel);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 18px;
    color: var(--text);
    outline: none;
    text-align: center;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: border-color 0.2s;
  }

  .lobby-input::placeholder {
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: none;
  }

  .lobby-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .share-bar {
    width: 100%;
    max-width: 340px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }

  .room-label {
    font-size: 14px;
    color: var(--text-dim);
  }

  .room-label strong {
    color: var(--accent);
    letter-spacing: 0.15em;
    font-size: 16px;
  }

  .share-btn {
    background: var(--accent);
    color: var(--btn-text);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .share-btn:active { transform: scale(0.96); }

  .input-area input:disabled,
  .spin-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .room-created-label {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
  }

  .room-code-display {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-align: center;
    padding: 12px 0;
    font-family: 'Menlo', 'Courier New', monospace;
  }

  .room-link-box {
    width: 100%;
    max-width: 260px;
    background: var(--bg-reel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    word-break: break-all;
    line-height: 1.4;
  }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mdjbitptifpxmkmhttne.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kamJpdHB0aWZweG1rbWh0dG5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjYzNzcsImV4cCI6MjEwMTYwMjM3N30.b0toWlVc27NBN9eR-BTVaoaXlcuiBCo39-bvKr-sdig';
const MAX_PLAYERS = 10;
const CELL_H = 90;
const DPR = 2;

let players = [];
let spinning = false;
let roomCode = null;

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const spinBtn = document.getElementById('spinBtn');
const nameInput = document.getElementById('nameInput');
const resultNum = document.getElementById('resultNum');
const rankingList = document.getElementById('rankingList');
const countLabel = document.getElementById('countLabel');
const resetBtn = document.getElementById('resetBtn');
const guideEl = document.getElementById('guide');
const toastEl = document.getElementById('toast');
const lobbyEl = document.getElementById('lobby');
const gameArea = document.getElementById('gameArea');
const roomCodeLabel = document.getElementById('roomCodeLabel');
const joinRoomBtn = document.getElementById('joinRoomBtn');
const roomCodeInput = document.getElementById('roomCodeInput');
const spinControls = document.getElementById('spinControls');

// --- Room management ---

function getRoomFromURL() {
  return new URLSearchParams(window.location.search).get('sala');
}

function joinRoom() {
  const code = roomCodeInput.value.trim().toUpperCase();
  if (!code || code.length < 4) {
    toast('Ingresa un codigo de sala valido');
    roomCodeInput.focus();
    return;
  }
  window.location.href = window.location.pathname + '?sala=' + code;
}

async function enterGame() {
  lobbyEl.style.display = 'none';
  gameArea.style.display = '';
  roomCodeLabel.textContent = roomCode;
  await loadPlayers();
  subscribeToChanges();
  renderRanking();
  updateGuide();
  updateSpinButton();
  checkAlreadyPlayed();
}

// --- Supabase data ---

async function loadPlayers() {
  const { data, error } = await sb
    .from('sorteo_players')
    .select('name, score')
    .eq('room_code', roomCode)
    .order('score', { ascending: false });

  if (error) {
    console.error('Error loading players:', error);
    toast('Error al cargar datos');
    return;
  }
  players = data || [];
}

async function savePlayer(name, score) {
  const { error } = await sb
    .from('sorteo_players')
    .insert({ room_code: roomCode, name, score });

  if (error) {
    console.error('Error saving player:', error);
    if (error.code === '23505') {
      toast('Nombre o numero ya registrado');
      return false;
    }
    toast('Error al guardar');
    return false;
  }
  return true;
}

function subscribeToChanges() {
  sb.channel('room-' + roomCode)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'sorteo_players',
      filter: 'room_code=eq.' + roomCode
    }, (payload) => {
      const p = payload.new;
      if (!players.some(x => x.name === p.name)) {
        players.push({ name: p.name, score: p.score });
        players.sort((a, b) => b.score - a.score);
        renderRanking();
        updateSpinButton();
        updateGuide();
      }
    })
    .on('postgres_changes', {
      event: 'DELETE',
      schema: 'public',
      table: 'sorteo_players',
      filter: 'room_code=eq.' + roomCode
    }, () => {
      loadPlayers().then(() => {
        renderRanking();
        updateSpinButton();
        updateGuide();
        checkAlreadyPlayed();
      });
    })
    .subscribe();
}

function updateSpinButton() {
  if (players.length >= MAX_PLAYERS) {
    spinBtn.disabled = true;
    spinBtn.textContent = 'Sorteo Completo';
    nameInput.disabled = true;
  } else if (!spinning) {
    spinBtn.disabled = false;
    spinBtn.textContent = 'Girar';
    nameInput.disabled = false;
  }
}

// --- Share ---


function hasPlayed(name) {
  return players.some(p => p.name.toLowerCase() === name.toLowerCase());
}

function getLocalPlayer() {
  try {
    const data = JSON.parse(localStorage.getItem('sorteo_player') || '{}');
    if (data.room === roomCode) return data.name;
  } catch(e) {}
  return null;
}

function setLocalPlayer(name) {
  localStorage.setItem('sorteo_player', JSON.stringify({ room: roomCode, name }));
}

function clearLocalPlayer() {
  localStorage.removeItem('sorteo_player');
}

function checkAlreadyPlayed() {
  const localName = getLocalPlayer();
  if (localName && hasPlayed(localName)) {
    spinControls.style.display = 'none';
  } else {
    if (localName && !hasPlayed(localName)) clearLocalPlayer();
    spinControls.style.display = '';
  }
}

// --- Canvas reels ---

function getColors() {
  const s = getComputedStyle(document.documentElement);
  return {
    text: s.getPropertyValue('--text').trim() || '#e8ecf1',
    accent: s.getPropertyValue('--accent').trim() || '#f0c040',
    bg: s.getPropertyValue('--bg-reel').trim() || '#0a0e14',
  };
}

class Reel {
  constructor(canvasId) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.position = 0;
    this.velocity = 0;
    this.target = null;
    this.settled = false;
    this.finalDigit = 0;
  }

  drawFrame() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;
    const cellH = CELL_H * DPR;
    const colors = getColors();

    ctx.clearRect(0, 0, w, h);

    const centerY = h / 2;
    const posInCells = this.position;
    const baseCellIndex = Math.floor(posInCells);
    const fractional = posInCells - baseCellIndex;

    for (let offset = -1; offset <= 1; offset++) {
      const cellIndex = baseCellIndex + offset;
      const digit = ((cellIndex % 10) + 10) % 10;
      const y = centerY + (offset - fractional) * cellH;

      const distFromCenter = Math.abs(y - centerY) / cellH;
      const isCenter = distFromCenter < 0.3;

      ctx.font = `bold ${42 * DPR}px Menlo, Courier New, monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (this.settled && isCenter) {
        ctx.fillStyle = colors.accent;
        ctx.shadowColor = colors.accent;
        ctx.shadowBlur = 20;
      } else {
        ctx.fillStyle = colors.text;
        ctx.shadowBlur = 0;
      }

      ctx.fillText(digit, w / 2, y);
      ctx.shadowBlur = 0;
    }
  }
}

const reelObjects = [new Reel('reel0'), new Reel('reel1'), new Reel('reel2')];

function drawAllReels() {
  reelObjects.forEach(r => r.drawFrame());
}

drawAllReels();

// --- Spin physics: aceleración suave → crucero → frenado largo → asentamiento ---

function easeInCubic(t) { return t * t * t; }

function spinReels(targets, onComplete) {
  const maxSpeed = [2.4, 2.6, 2.8];
  const accelDuration = [55, 60, 65];
  const cruiseFrames = [60, 85, 110];
  const brakeDuration = [120, 140, 160];
  const staggerFrames = [0, 12, 24];

  let frame = 0;
  let settledCount = 0;
  const finalDigits = [...targets];

  reelObjects.forEach((r, i) => {
    r.velocity = 0;
    r.target = null;
    r.settled = false;
    r.phase = 'wait';
    r.phaseFrame = 0;
    r.finalDigit = targets[i];
    r.brakeStartSpeed = 0;
  });

  function animate() {
    frame++;

    reelObjects.forEach((r, i) => {
      if (r.settled) return;

      if (r.phase === 'wait') {
        if (frame >= staggerFrames[i]) {
          r.phase = 'accel';
          r.phaseFrame = 0;
        }
        return;
      }

      r.phaseFrame++;

      if (r.phase === 'accel') {
        const t = Math.min(r.phaseFrame / accelDuration[i], 1);
        r.velocity = maxSpeed[i] * easeInCubic(t);
        if (t >= 1) {
          r.velocity = maxSpeed[i];
          r.phase = 'cruise';
          r.phaseFrame = 0;
        }
      }

      else if (r.phase === 'cruise') {
        r.velocity = maxSpeed[i];
        if (r.phaseFrame >= cruiseFrames[i]) {
          r.phase = 'brake';
          r.phaseFrame = 0;
          r.brakeStartSpeed = r.velocity;
        }
      }

      else if (r.phase === 'brake') {
        const t = Math.min(r.phaseFrame / brakeDuration[i], 1);
        const ease = 1 - (1 - t) * (1 - t) * (1 - t);
        r.velocity = r.brakeStartSpeed * (1 - ease);

        if (r.velocity < 0.15) {
          r.velocity = 0.15;
        }

        if (r.target === null && r.velocity <= 0.2) {
          const currentDigit = ((Math.round(r.position) % 10) + 10) % 10;
          let advance = (finalDigits[i] - currentDigit + 10) % 10;
          if (advance < 3) advance += 10;
          r.target = Math.round(r.position) + advance;
          r.phase = 'settle';
          r.phaseFrame = 0;
        }
      }

      else if (r.phase === 'settle') {
        const dist = r.target - r.position;
        if (dist <= 0.003) {
          r.position = r.target;
          r.velocity = 0;
          r.settled = true;
          settledCount++;
        } else {
          r.velocity = Math.max(0.008, dist * 0.045);
        }
      }

      r.position += r.velocity;
      r.drawFrame();
    });

    if (settledCount < 3) {
      requestAnimationFrame(animate);
    } else {
      reelObjects.forEach(r => r.drawFrame());
      onComplete();
    }
  }

  requestAnimationFrame(animate);
}

// --- Game logic ---

function spin() {
  const name = nameInput.value.trim();
  if (!name) {
    toast('Escribe un nombre primero');
    nameInput.focus();
    return;
  }
  if (hasPlayed(name)) {
    toast('Este participante ya tiro');
    nameInput.value = '';
    nameInput.focus();
    return;
  }
  if (players.length >= MAX_PLAYERS) {
    toast('Ya hay 10 participantes');
    return;
  }
  if (spinning) return;

  spinning = true;
  spinBtn.disabled = true;
  resultNum.classList.remove('visible');

  const targets = [
    Math.floor(Math.random() * 10),
    Math.floor(Math.random() * 10),
    Math.floor(Math.random() * 10),
  ];

  const finalNumber = targets[0] * 100 + targets[1] * 10 + targets[2];
  const isDuplicate = players.some(p => p.score === finalNumber);

  spinReels(targets, async () => {
    const display = String(finalNumber).padStart(3, '0');
    resultNum.textContent = display;
    resultNum.classList.add('visible');

    if (isDuplicate) {
      toast('Numero repetido — gira otra vez');
      spinning = false;
      updateSpinButton();
      return;
    }

    const saved = await savePlayer(name, finalNumber);
    if (!saved) {
      spinning = false;
      updateSpinButton();
      return;
    }

    if (!players.some(p => p.name === name && p.score === finalNumber)) {
      players.push({ name, score: finalNumber });
      players.sort((a, b) => b.score - a.score);
    }

    setLocalPlayer(name);
    updateGuide();
    const position = players.findIndex(p => p.name === name && p.score === finalNumber) + 1;
    renderRanking();
    nameInput.value = '';

    if (players.length >= MAX_PLAYERS) {
      toast('Sorteo completo');
    } else {
      toast(`${name} quedo en posicion ${position}`);
    }

    spinning = false;
    updateSpinButton();
    checkAlreadyPlayed();
  });
}

function renderRanking() {
  countLabel.textContent = `${players.length} / ${MAX_PLAYERS}`;
  let html = '';

  players.forEach((p, i) => {
    html += `<div class="rank-row">
      <div class="rank-pos">${i + 1}</div>
      <div class="rank-name">${escapeHtml(p.name)}</div>
      <div class="rank-score">${String(p.score).padStart(3, '0')}</div>
    </div>`;
  });

  for (let i = players.length; i < MAX_PLAYERS; i++) {
    html += `<div class="empty-row">
      <div class="rank-pos">${i + 1}</div>
      <div class="rank-name">Disponible</div>
      <div class="rank-score">---</div>
    </div>`;
  }

  rankingList.innerHTML = html;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

let toastTimeout;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

async function reset() {
  await sb.from('sorteo_players').delete().eq('room_code', roomCode);
  players = [];
  spinning = false;
  nameInput.value = '';
  resultNum.textContent = '---';
  resultNum.classList.remove('visible');
  reelObjects.forEach(r => {
    r.position = 0;
    r.velocity = 0;
    r.target = null;
    r.settled = false;
    r.drawFrame();
  });
  renderRanking();
  updateSpinButton();
  updateGuide();
  toast('Sorteo reiniciado');
}

spinBtn.addEventListener('click', spin);
resetBtn.addEventListener('click', reset);
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') spin();
});
joinRoomBtn.addEventListener('click', joinRoom);
roomCodeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') joinRoom();
});

function updateGuide() {
  if (players.length > 0) {
    guideEl.classList.add('hidden');
  } else {
    guideEl.classList.remove('hidden');
  }
}

// Init
const urlRoom = getRoomFromURL();
if (urlRoom) {
  roomCode = urlRoom.toUpperCase();
  enterGame();
}
</script>
