<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin — Club de Ahorro</title>
<style>
  :root {
    --bg: #0e1b30;
    --bg-card: #142240;
    --bg-reel: #0b1526;
    --border: #1e3355;
    --text: #e4eaf2;
    --text-dim: #6b8aad;
    --accent: #7cb62f;
    --accent-glow: rgba(124, 182, 47, 0.3);
    --btn-text: #ffffff;
  }

  :root[data-theme="light"] {
    --bg: #f2f5f0;
    --bg-card: #ffffff;
    --bg-reel: #e6ebe0;
    --border: #c8d4be;
    --text: #1a2d4d;
    --text-dim: #5a7a6a;
    --accent: #5a9a1a;
    --accent-glow: rgba(90, 154, 26, 0.15);
    --btn-text: #ffffff;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f5f0;
      --bg-card: #ffffff;
      --bg-reel: #e6ebe0;
      --border: #c8d4be;
      --text: #1a2d4d;
      --text-dim: #5a7a6a;
      --accent: #5a9a1a;
      --accent-glow: rgba(90, 154, 26, 0.15);
      --btn-text: #ffffff;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
    -webkit-user-select: none;
    user-select: none;
  }

  h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
    text-align: center;
  }

  .tagline {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 32px;
    text-align: center;
  }

  .card {
    width: 100%;
    max-width: 340px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .btn {
    width: 100%;
    max-width: 260px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s, opacity 0.2s;
  }

  .btn:active { transform: scale(0.96); }

  .btn.primary {
    background: var(--accent);
    color: var(--btn-text);
  }

  .btn.secondary {
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
  }

  .label {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
  }

  .room-code {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-align: center;
    padding: 12px 0;
    font-family: 'Menlo', 'Courier New', monospace;
  }

  .link-box {
    width: 100%;
    max-width: 260px;
    background: var(--bg-reel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    word-break: break-all;
    line-height: 1.4;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg-card);
    border: 1.5px solid var(--accent);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: transform 0.3s ease-out, opacity 0.3s;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<h1>Club de Ahorro</h1>
<p class="tagline">Panel de administrador</p>

<div class="card" id="createView">
  <p class="label">Crea una sala para iniciar un nuevo sorteo</p>
  <button class="btn primary" id="createBtn">Nueva Sala</button>
</div>

<div class="card" id="roomView" style="display:none">
  <p class="label">Sala creada</p>
  <div class="room-code" id="roomCode"></div>
  <div class="link-box" id="roomLink"></div>
  <button class="btn primary" id="shareBtn">Compartir Link</button>
  <button class="btn secondary" id="goBtn">Ir al Sorteo</button>
  <button class="btn secondary" id="newBtn">Crear Otra Sala</button>
</div>

<div class="toast" id="toast"></div>

<script>
function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function getGameLink(code) {
  const base = window.location.href.replace(/admin\.html.*$/, 'index.html');
  return base + '?sala=' + code;
}

let currentCode = null;

const createView = document.getElementById('createView');
const roomView = document.getElementById('roomView');
const roomCodeEl = document.getElementById('roomCode');
const roomLinkEl = document.getElementById('roomLink');
const toastEl = document.getElementById('toast');

let toastTimeout;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function createRoom() {
  currentCode = generateRoomCode();
  roomCodeEl.textContent = currentCode;
  roomLinkEl.textContent = getGameLink(currentCode);
  createView.style.display = 'none';
  roomView.style.display = '';
}

function shareRoom() {
  const url = getGameLink(currentCode);
  if (navigator.share) {
    navigator.share({
      title: 'Club de Ahorro — Sorteo',
      text: 'Unite al sorteo de turnos! Sala: ' + currentCode,
      url: url,
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => {
      toast('Link copiado');
    }).catch(() => {
      toast('Sala: ' + currentCode);
    });
  }
}

function goToGame() {
  window.location.href = getGameLink(currentCode);
}

function createAnother() {
  createRoom();
  toast('Nueva sala creada');
}

document.getElementById('createBtn').addEventListener('click', createRoom);
document.getElementById('shareBtn').addEventListener('click', shareRoom);
document.getElementById('goBtn').addEventListener('click', goToGame);
document.getElementById('newBtn').addEventListener('click', createAnother);
</script>
